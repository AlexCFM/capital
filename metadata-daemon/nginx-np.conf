# np.rizzfm.com — serves only the now-playing JSON written by now_playing.py.
# Sits behind Cloudflare (proxied DNS record), using the Cloudflare origin cert.

server {
    listen 80;
    server_name np.rizzfm.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name np.rizzfm.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/nowplaying;

    # ~5 KB JSON shrinks to ~1.5 KB; "proxied any" because every request
    # arrives through Cloudflare, which nginx would otherwise not compress for
    gzip on;
    gzip_types application/json;
    gzip_proxied any;

    location = /capital.json {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
        default_type application/json;
        charset utf-8;
    }

    # Apple Music top-10s for the site's charts block, refreshed daily
    location = /charts.json {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=600" always;
        default_type application/json;
        charset utf-8;
    }

    location / {
        return 404;
    }
}
